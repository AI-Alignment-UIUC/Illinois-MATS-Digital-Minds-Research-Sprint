<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lens Chat</title>
<style>
  :root { --bg:#111418; --panel:#1a1f26; --text:#e6e9ee; --dim:#9aa4b2;
          --accent:#5aa9e6; --user:#243447; --asst:#1f2a22; --think:#2a2433; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 system-ui, sans-serif; display:flex; height:100vh; }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #header { padding:10px 16px; background:var(--panel); display:flex; gap:16px;
            align-items:center; flex-wrap:wrap; border-bottom:1px solid #000; }
  #header .name { font-weight:600; }
  #header label { color:var(--dim); font-size:13px; }
  #header input[type=number] { width:56px; background:#0d1013; color:var(--text);
            border:1px solid #333; border-radius:4px; padding:2px 6px; }
  #chat { flex:1; overflow-y:auto; padding:16px; }
  .msg { max-width:860px; margin:0 auto 12px; padding:10px 14px; border-radius:10px;
         white-space:pre-wrap; word-break:break-word; }
  .user  { background:var(--user); }
  .assistant { background:var(--asst); }
  .think { background:var(--think); color:var(--dim); font-size:13px;
           border-radius:8px; padding:6px 10px; margin-bottom:8px;
           white-space:pre-wrap; }
  .tok { cursor:pointer; border-radius:3px; }
  .tok:hover { background:var(--accent); color:#000; }
  .tok.sel { background:#e6c15a; color:#000; }
  #inputrow { display:flex; padding:12px 16px; gap:8px; background:var(--panel); }
  #prompt { flex:1; background:#0d1013; color:var(--text); border:1px solid #333;
            border-radius:8px; padding:10px; font:inherit; resize:none; }
  button { background:var(--accent); border:0; color:#04121f; font-weight:600;
           border-radius:8px; padding:0 18px; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  #side { width:300px; background:var(--panel); border-left:1px solid #000;
          padding:14px; overflow-y:auto; }
  #side h3 { margin:0 0 4px; font-size:14px; }
  #side .hint { color:var(--dim); font-size:12px; margin-bottom:10px; }
  .lensrow { display:flex; align-items:center; gap:8px; margin:4px 0;
             font:13px ui-monospace, monospace; }
  .lensrow .bar { height:10px; background:var(--accent); border-radius:3px; }
  .lensrow .t { min-width:90px; white-space:pre; background:#0d1013;
                padding:1px 6px; border-radius:4px; }
  .toggle { display:flex; align-items:center; gap:6px; }
</style>
</head>
<body>
<div id="main">
  <div id="header">
    <span class="name" id="modelname">…</span>
    <label class="toggle"><input type="checkbox" id="thinking"> thinking</label>
    <label>layers <input type="number" id="lo" value="1" min="1"> –
           <input type="number" id="hi" value="1" min="1"></label>
    <span class="hint" style="color:var(--dim);font-size:12px">
      click a token in an assistant reply to read its accumulated r-lens</span>
    <button id="clear" style="margin-left:auto;background:#3a2a2a;color:#e6a5a5">Clear chat</button>
  </div>
  <div id="chat"></div>
  <div id="inputrow">
    <textarea id="prompt" rows="2" placeholder="Message…  (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send">Send</button>
    <button id="stop" style="background:#a85454;color:#fff" disabled>Stop</button>
  </div>
</div>
<div id="side">
  <h3>r-lens readout</h3>
  <div class="hint" id="lensinfo">no token selected</div>
  <div id="lensout"></div>
</div>
<script>
const chatEl = document.getElementById('chat');
const promptEl = document.getElementById('prompt');
const sendBtn = document.getElementById('send');
const loEl = document.getElementById('lo'), hiEl = document.getElementById('hi');
let messages = [];       // {role, content}
let numLayers = 1;
let busy = false;
let selected = null;

fetch('/api/meta').then(r => r.json()).then(m => {
  numLayers = m.num_layers;
  loEl.max = hiEl.max = numLayers;
  hiEl.value = numLayers;
  document.getElementById('modelname').textContent =
    m.model_name + (m.lora ? ' + ' + m.lora : '') + (m.has_lenses ? '' : ' (no lenses)');
});

function clampLayers() {
  let lo = Math.max(1, Math.min(+loEl.value || 1, numLayers));
  let hi = Math.max(lo, Math.min(+hiEl.value || numLayers, numLayers));
  loEl.value = lo; hiEl.value = hi;
  return [lo, hi];
}
loEl.onchange = hiEl.onchange = () => { clampLayers(); if (selected) queryLens(selected); };

function renderAssistant(el, text) {
  el.textContent = '';
  // thinking may stream as "<think>…</think>…" or, when the chat template
  // pre-opens the tag, as "…</think>…" with no opener
  const m = text.match(/^\s*(?:<think>)?([\s\S]*?)<\/think>([\s\S]*)/) ||
            text.match(/^\s*<think>([\s\S]*?)$()/);
  if (m) {
    const think = document.createElement('div');
    think.className = 'think';
    think.textContent = m[1].trim();
    if (m[1].trim()) el.appendChild(think);
    el.appendChild(document.createTextNode((m[2] || '').replace(/^\s+/, '')));
  } else {
    el.textContent = text;
  }
}

const stopBtn = document.getElementById('stop');
stopBtn.onclick = () => fetch('/api/stop', {method: 'POST'});

async function send() {
  const content = promptEl.value.trim();
  if (!content || busy) return;
  busy = true; sendBtn.disabled = true; stopBtn.disabled = false;
  promptEl.value = '';
  messages.push({role: 'user', content});
  addBubble('user').textContent = content;
  const bubble = addBubble('assistant');
  bubble.textContent = '…';
  const thinking = document.getElementById('thinking').checked;
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages, thinking}),
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let full = '';
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      full += dec.decode(value, {stream: true});
      renderAssistant(bubble, full);
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    messages.push({role: 'assistant', content: full});
    await tokenize(thinking);
  } finally {
    busy = false; sendBtn.disabled = false; stopBtn.disabled = true;
  }
}

function addBubble(cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function tokenize(thinking) {
  // Re-render the whole conversation as clickable tokens (assistant turns).
  const r = await fetch('/api/tokens', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({messages, thinking}),
  });
  const data = await r.json();
  chatEl.innerHTML = '';
  const div = addBubble('assistant');
  div.style.maxWidth = '860px';
  data.tokens.forEach((t, i) => {
    const span = document.createElement('span');
    span.className = 'tok';
    span.textContent = t;
    span.onclick = () => { selectToken(span, i, t); };
    div.appendChild(span);
  });
}

function selectToken(span, i, t) {
  document.querySelectorAll('.tok.sel').forEach(e => e.classList.remove('sel'));
  span.classList.add('sel');
  selected = {index: i, text: t};
  queryLens(selected);
}

async function queryLens(sel) {
  const [lo, hi] = clampLayers();
  document.getElementById('lensinfo').textContent =
    `token ${sel.index} ${JSON.stringify(sel.text)}, layers ${lo}–${hi}`;
  const r = await fetch('/api/lens', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({index: sel.index, lo, hi}),
  });
  const data = await r.json();
  const out = document.getElementById('lensout');
  out.innerHTML = '';
  if (data.error) { out.textContent = data.error; return; }
  const max = data.top[0].prob || 1;
  for (const row of data.top) {
    const div = document.createElement('div');
    div.className = 'lensrow';
    const tok = document.createElement('span');
    tok.className = 't'; tok.textContent = JSON.stringify(row.token);
    const bar = document.createElement('span');
    bar.className = 'bar'; bar.style.width = (100 * row.prob / max) + 'px';
    const p = document.createElement('span');
    p.textContent = row.prob.toFixed(4);
    div.append(tok, bar, p);
    out.appendChild(div);
  }
}

document.getElementById('clear').onclick = () => {
  if (busy) return;
  messages = [];
  selected = null;
  chatEl.innerHTML = '';
  document.getElementById('lensout').innerHTML = '';
  document.getElementById('lensinfo').textContent = 'no token selected';
};

sendBtn.onclick = send;
promptEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
